name: Deploy

on:
  # Автодеплой отключён — запускается вручную через UI
  # Раскомментируйте, когда будете готовы к автоматическому деплою:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================="
            echo "🚀 QUIZPLEASE PARSER DEPLOY"
            echo "=========================================="
            echo "🕐 $(date)"
            echo ""

            cd /opt/quizplease-parser

            echo "📂 Директория: $(pwd)"
            echo ""

            echo "📥 Обновление кода..."
            git fetch origin
            git reset --hard origin/main
            echo "✅ Код обновлён"
            git log --oneline -1
            echo ""

            echo "🐍 Активация venv..."
            if [ -f venv/bin/activate ]; then
              source venv/bin/activate
              echo "✅ venv активирован"
            else
              python3 -m venv venv
              source venv/bin/activate
              echo "✅ venv создан"
            fi
            echo ""

            echo "📦 Установка зависимостей..."
            pip install --upgrade pip
            pip install -r requirements.txt
            echo "✅ Зависимости установлены"
            echo ""

            echo "📁 Создание директорий..."
            mkdir -p logs data
            echo "✅ Директории созданы"
            echo ""

            echo "🔍 Проверка config.py..."
            if [ ! -f src/config.py ]; then
              echo "❌ src/config.py не найден!"
              echo "Скопируйте src/config.example.py в src/config.py и заполните"
              exit 1
            fi
            echo "✅ config.py найден"
            echo ""

            echo "🔄 Перезапуск сервиса..."
            if systemctl list-units --type=service --all 2>/dev/null | grep -q quizplease-parser; then
              systemctl restart quizplease-parser
              echo "✅ Сервис перезапущен"
              systemctl status quizplease-parser --no-pager || true
            else
              echo "⚠️ Сервис quizplease-parser не найден"
              echo "Создайте /etc/systemd/system/quizplease-parser.service"
            fi

            echo ""
            echo "=========================================="
            echo "✅ ДЕПЛОЙ ЗАВЕРШЁН"
            echo "=========================================="
            echo "🕐 $(date)"